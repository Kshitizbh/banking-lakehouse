name: banking-lakehouse

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.52       # pinned version
    container_name: seaweedfs
    command: ["mini", "-dir=/data", "-admin.allowInsecureBind=true"]     # all-in-one mode: storage + S3 API + admin UI
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}       # read from your .env
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${LANDING_BUCKET}              # creates the "landing" bucket on start
    ports:
      - "8333:8333"                 # S3 API
      - "127.0.0.1:12535:12535"
    volumes:
      - seaweed_data:/data                # data survives container restarts
    mem_limit: 512m                       # protects your laptop
    restart: unless-stopped

volumes:
  seaweed_data: